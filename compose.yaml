services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      PLATFORM_DB: /app/data/platform.db
      PLATFORM_TOKEN: ${PLATFORM_TOKEN:-local-demo-change-me}
      PROMETHEUS_URL: http://prometheus:9090
      MODEL_MODE: ${MODEL_MODE:-offline}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    volumes: ["platform-data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard.py", "--server.address=0.0.0.0", "--browser.gatherUsageStats=false"]
    ports: ["127.0.0.1:8501:8501"]
    environment:
      PLATFORM_API: http://api:8000
      PLATFORM_TOKEN: ${PLATFORM_TOKEN:-local-demo-change-me}
    depends_on:
      api: {condition: service_healthy}
  prometheus:
    image: prom/prometheus:v3.13.5
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/alerts.yml:/etc/prometheus/alerts.yml:ro
  alertmanager:
    image: prom/alertmanager:v0.34.1
    ports: ["127.0.0.1:9093:9093"]
    volumes: ["./infra/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
  grafana:
    image: grafana/grafana:13.2.4
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-platformcare-local-demo}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
  airflow:
    image: apache/airflow:3.3.2
    command: standalone
    ports: ["127.0.0.1:8080:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      PLATFORM_API: http://api:8000
      PLATFORM_TOKEN: ${PLATFORM_TOKEN:-local-demo-change-me}
    volumes: ["./dags:/opt/airflow/dags:ro", "airflow-data:/opt/airflow"]
    depends_on:
      api: {condition: service_healthy}
  slack:
    build: .
    profiles: ["slack"]
    command: ["python", "-m", "platformcare.slack_bot"]
    env_file: .env
    environment:
      PLATFORM_DB: /app/data/platform.db
      PROMETHEUS_URL: http://prometheus:9090
    volumes: ["platform-data:/app/data"]
volumes:
  platform-data:
  airflow-data:
